name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.0

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name DownloadsOrganizer organizer.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/DownloadsOrganizer.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DownloadsOrganizer.exe" | Out-File -Encoding ascii "dist/DownloadsOrganizer.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadsOrganizer-Windows
          path: |
            dist/DownloadsOrganizer.exe
            dist/DownloadsOrganizer.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/DownloadsOrganizer.exe" `
            "dist/DownloadsOrganizer.sha256" `
            --verify-tag `
            --generate-notes `
            --title "Downloads Organizer ${{ github.ref_name }}"
